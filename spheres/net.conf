# The net sphere owns the physical NIC (VFIO) and routes every other sphere.
NAME=net
COLOR=f7768e
CID=10
MEM=512
CPUS=1
ROLE=net
# uplink = physical NIC via VFIO (or host NAT fallback); serves br-net as its LAN.
NET=uplink
SERVES=br-net
# PCI addresses of NICs to pass through, e.g. "0000:03:00.0". Detected at install when empty.
VFIO=""
APPS="nm-connection-editor alacritty"
AUTOSTART=1
